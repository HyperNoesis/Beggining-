<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Genesis</title>
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08090a">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-outer">
      <div class="auth-visual">
        <div id="authIris"></div>
        <div class="eyebrow">Almost done</div>
        <h2>Set a new password.</h2>
        <p>Pick something you'll remember — you'll use it to sign in from any device.</p>
      </div>
      <div class="auth-card">
        <div class="brand-header">
          <img src="assets/logo-mark.png" alt="Rejuvini">
          <div>
            <h1>Genesis</h1>
            <div class="brand-sub">by Rejuvini</div>
          </div>
        </div>
        <p class="subtitle">Choose a new password</p>

        <form id="resetForm">
          <div class="field">
            <label>New password</label>
            <input type="password" id="rpPassword" placeholder="At least 6 characters">
          </div>
          <div class="field">
            <label>Confirm new password</label>
            <input type="password" id="rpPassword2" placeholder="At least 6 characters">
          </div>
          <button type="submit" class="btn primary full-btn full">Set new password</button>
          <div class="error-msg" id="rpError"></div>
          <div class="success-msg" id="rpNotice" style="display:none;"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/error-boundary.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-loader.js"></script>
  <script src="js/providers/auth-provider.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/iris.js"></script>
  <script>
    document.getElementById('authIris').innerHTML = window.VS.irisSVG();
    const resetForm = document.getElementById('resetForm');
    const errorEl = document.getElementById('rpError');
    const noticeEl = document.getElementById('rpNotice');

    if (window.VS.auth.mode !== 'supabase') {
      errorEl.textContent = 'Password reset links only work with cloud accounts (Supabase configured) — this device is running local-only accounts.';
      resetForm.querySelector('button').disabled = true;
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = ''; noticeEl.style.display = 'none';
      const p1 = document.getElementById('rpPassword').value;
      const p2 = document.getElementById('rpPassword2').value;
      if (p1 !== p2) { errorEl.textContent = 'Passwords don\u2019t match.'; return; }
      const btn = resetForm.querySelector('button');
      btn.disabled = true; btn.textContent = 'Please wait...';
      try {
        // Supabase's reset-link redirect already establishes a temporary
        // recovery session from the URL — updatePassword() just needs to
        // call auth.updateUser(), same as a normal password change.
        await window.VS.auth.updatePassword(p1);
        noticeEl.textContent = 'Password updated. Redirecting to sign in...';
        noticeEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'auth.html'; }, 1500);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>
