<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis Remote</title>
<link rel="icon" href="assets/logo.png">
<meta name="theme-color" content="#08090a">
<style>
  :root{--bg:#08090a;--card:#16181b;--tx:#f2f3f5;--dim:#a3a8b0;--ac:#6ea8ff;--ok:#5ed38a;--bad:#ff7b7b}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:14px 16px;max-width:520px;margin:0 auto}
  h1{font-size:18px;margin:4px 0 2px} #st{font-size:14px;color:var(--dim);min-height:20px;margin-bottom:10px}
  #st.ok{color:var(--ok)} #st.bad{color:var(--bad)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  button{min-height:64px;font-size:17px;border-radius:14px;border:1px solid #2a2e33;background:var(--card);color:var(--tx);font-weight:600}
  button:active{background:#22262b} button:focus-visible{outline:3px solid var(--ac)} button.big{grid-column:1/-1;min-height:84px;font-size:22px;background:var(--ac);color:#06101f;border:0}
  button:disabled{opacity:.4} .info{font-size:13px;color:var(--dim);margin:8px 0}
</style>
</head>
<body>
<h1>Genesis Remote</h1>
<div id="st" role="status" aria-live="polite">Connecting…</div>
<div class="grid">
  <button class="big" id="bToggle" data-cmd="toggle" disabled>Start / Pause</button>
  <button data-cmd="slower" disabled>Slower</button><button data-cmd="faster" disabled>Faster</button>
  <button data-cmd="lines-back" disabled>Back 3 lines</button><button data-cmd="lines-fwd" disabled>Forward 3 lines</button>
  <button data-cmd="smaller" disabled>Text smaller</button><button data-cmd="bigger" disabled>Text bigger</button>
  <button data-cmd="top" disabled style="grid-column:1/-1">Back to top</button>
  <button class="big" data-cmd="step-next" id="bNext" disabled style="background:#5ed38a">NEXT step</button>
  <button data-cmd="step-back" disabled style="grid-column:1/-1">Back one step</button>
</div>
<div class="info" id="info"></div>
<p class="info">Only buttons travel to the studio. Your video and script never pass through this page.</p>
<script src="js/prompter-core.js"></script>
<script src="js/config.js"></script>
<script src="js/remote.js"></script>
</body>
</html>
