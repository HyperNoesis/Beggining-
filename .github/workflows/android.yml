name: Build Genesis APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, android-wrapper]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run sync
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Genesis.apk
          TAG="android-build-${{ github.run_number }}"
          gh release create "$TAG" Genesis.apk --title "Genesis Android build ${{ github.run_number }}" --notes "Debug APK. Install on Android, allow unknown apps." --target "${{ github.sha }}"
